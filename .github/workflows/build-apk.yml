name: Build APK Otomatis

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install, Setup Capacitor & Build APK
        run: |
          npm install --legacy-peer-deps
          npm run build

          # Instal Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

          # Buat konfigurasi JSON langsung (menghindari bug parsing .ts)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yamasy.app",
            "appName": "YamasyApp",
            "webDir": "dist"
          }
          EOF

          # Tambahkan Android & Sync
          npx cap add android
          npx cap sync android

          # Compile menjadi APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: hasil-aplikasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
